[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "hotel-curator"
version = "2.0.0"
description = "Attribute-level hotel quality tiers from guest reviews, with evidence."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "hotel-curator contributors" }]
# Core = what the API server needs at runtime: no torch, no scikit-learn.
dependencies = [
    "alembic>=1.14",
    "fastapi>=0.115",
    "limits>=5.0",
    "numpy>=2.1",
    "onnxruntime>=1.20",
    "pandas>=2.2",
    "pyarrow>=18.0",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "pyyaml>=6.0",
    "scipy>=1.14",
    "sqlalchemy>=2.0.36",
    "structlog>=24.4",
    "tokenizers>=0.21",
    "typer>=0.15",
    "uvicorn[standard]>=0.34",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
data = [
    "httpx>=0.28",
    "pandera[pandas]>=0.22",
    # Person-name redaction in evidence quotes (offline scoring job only).
    "spacy>=3.8.16,<3.9",
    "en-core-web-sm==3.8.0",  # wheel URL pinned in [tool.uv.sources]
]
ml = [
    "lightgbm>=4.5",
    "matplotlib>=3.9",
    "mlflow>=3.17.2",
    "onnx>=1.17",
    "onnxscript>=0.2",
    "safetensors>=0.4",
    "scikit-learn>=1.6",
    "statsmodels>=0.14",
    "torch>=2.5",
    "transformers>=4.48",
]
dev = [
    "hypothesis>=6.120",
    "mypy>=1.14",
    "pandas-stubs>=2.2",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.9",
    "types-PyYAML>=6.0",
]

[project.scripts]
curator = "hotel_curator.cli.main:app"

[project.urls]
Repository = "https://github.com/amit-badave-04/hotel-curator"

[tool.hatch.build.targets.wheel]
packages = ["src/hotel_curator"]

[tool.ruff]
line-length = 80
target-version = "py312"
extend-exclude = ["notebooks/v1", "web"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM", "RUF", "S", "N", "PTH", "D"]
ignore = [
    "D105", "D107",   # magic methods and __init__ documented on the class
    "D106",           # nested Config classes of schema models
    "RUF001", "RUF002", "RUF003",  # unicode in review text examples
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "S", "PTH", "N802"]
"src/hotel_curator/db/migrations/**" = ["D", "N999"]
"notebooks/**" = ["D", "E402"]
"scripts/**" = ["D"]

[tool.ruff.lint.isort]
known-first-party = ["hotel_curator"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "typer.Option", "typer.Argument"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["hotel_curator"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "lightgbm.*", "mlflow.*", "onnxruntime.*", "sklearn.*",
    "statsmodels.*", "transformers.*", "pandera.*", "scipy.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: needs real data or trained model artifacts",
    "postgres: needs a running PostgreSQL (CURATOR_TEST_POSTGRES_URL)",
    "eval: model-behaviour evaluation thresholds",
]
filterwarnings = ["error::DeprecationWarning:hotel_curator.*"]

[tool.coverage.run]
source = ["hotel_curator"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "if __name__ == .__main__.:"]

[tool.uv.sources]
# spaCy's model is published as a GitHub release asset, not on PyPI; uv.lock
# records the wheel's sha256.
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
