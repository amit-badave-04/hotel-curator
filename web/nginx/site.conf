# Server-level settings and locations shared by every edge mode; included
# inside the site's server block. Needs $curator_client_ip (set per mode)
# and the maps in http.conf.
root /usr/share/nginx/html;
index index.html;

client_max_body_size 64k;
# No byte ranges: nothing here needs them, and an unsatisfiable range (416)
# would be sent with the headers of the 200 it replaced, cache lifetime
# included.
max_ranges 0;
# Redirects stay relative, so nginx never builds a URL from its own port
# (8080 behind Fly) or scheme.
absolute_redirect off;
access_log /dev/stdout curator;

gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_proxied any;
gzip_vary on;
gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;

# Security headers for the app. Keep in sync with security-headers.ts
# (test/nginx-headers.test.ts checks this). No inline scripts or styles.
# An add_header in a location replaces these, so every location that sets
# its own also repeats HSTS.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Strict-Transport-Security $curator_hsts always;
add_header X-Request-ID $request_id always;
add_header Cache-Control $curator_cache_control always;

# The API, one origin for the browser: /api/v1/hotels -> /v1/hotels.
# The trailing slash on proxy_pass strips the /api prefix. Exactly one
# identity header reaches the API, X-Real-IP, overwritten here with the
# address this edge mode trusts; the others a client could send are blanked
# (an empty value drops the header). JSON answers get a CSP that allows
# nothing. The headers the API sends itself are replaced with nginx's own,
# so answers nginx makes for the API (413, 502, 504) carry them too, with
# the same request id the API adopted.
location /api/ {
    proxy_pass http://curator_api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $curator_client_ip;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header Forwarded "";
    proxy_set_header Fly-Client-IP "";
    proxy_set_header CF-Connecting-IP "";
    proxy_set_header True-Client-IP "";
    proxy_set_header X-Forwarded-Prefix /api;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    include curator/api-headers.conf;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
}

location = /api {
    return 301 /api/;
}

# The API's docs page. The API serves Swagger UI from its own pinned copy
# (no CDN) with an external init script, and sends this same policy; it
# is set here too because a location's add_header replaces the server's.
# Styles need 'unsafe-inline' (Swagger UI sets style attributes). The page
# fetches api/openapi.json and its assets relative to /api/docs, so they
# go through the /api/ location above.
location = /api/docs {
    proxy_pass http://curator_api/docs;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $curator_client_ip;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header Forwarded "";
    proxy_set_header Fly-Client-IP "";
    proxy_set_header CF-Connecting-IP "";
    proxy_set_header True-Client-IP "";
    proxy_hide_header Content-Security-Policy;
    include curator/api-headers.conf;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
}

# Container health check (Dockerfile HEALTHCHECK); the same path answers
# on the health-only port in Cloudflare mode.
location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
}

location /assets/ {
    try_files $uri =404;
}

# Single-page app: unknown paths get index.html and the router decides.
location / {
    try_files $uri /index.html;
}
