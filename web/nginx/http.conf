# http-level settings shared by every edge mode; included first by the
# rendered site file (/etc/nginx/conf.d/default.conf). ADR 011.

# No version number in Server headers or error pages, in any server block.
server_tokens off;
# Room for www.<domain> in Cloudflare mode (the default fits 46 bytes).
server_names_hash_bucket_size 128;

# Hashed build assets never change, but only a found asset is cached: a
# 404 for a chunk that a later deploy removed must not be kept for a year
# (by browsers or Cloudflare) in case a rollback brings the same name back.
# The link-preview image and the icons keep their names across deploys, so
# they are kept for a day, not a year. Errors are not stored at all;
# everything else is revalidated.
map "$status:$uri" $curator_cache_control {
    ~^(200|206|304):/assets/  "public, max-age=31536000, immutable";
    "~^(200|304):/(og-image\.png|apple-touch-icon\.png|favicon\.(ico|svg))$"
                              "public, max-age=86400";
    ~^[45]                    "no-store";
    default                   "no-cache";
}

# The one HSTS value, sent from every header block. A short max-age and no
# includeSubDomains or preload until the domain is settled (gap audit R18);
# Cloudflare's own HSTS setting stays off so there is never a second value.
map "" $curator_hsts {
    default "max-age=86400";
}

# The request id on answers from (or for) the API: the API's own when it
# answered (it adopts nginx's id when it trusts nginx, so they normally
# match), nginx's when nginx answered alone (413, 502, 504).
map $upstream_http_x_request_id $curator_api_request_id {
    ""      $request_id;
    default $upstream_http_x_request_id;
}

# The ids Fly's proxy (Fly mode; ADR 011, A19) and Cloudflare give a
# request, logged beside nginx's own so a visitor's fly-request-id or
# cf-ray response header finds the log line. Only for matching: a client
# can send either header in some modes, so anything that does not look
# like an id is logged as "".
map $http_fly_request_id $curator_fly_request_id {
    "~^[A-Za-z0-9_-]{1,64}$" $http_fly_request_id;
    default                  "";
}
map $http_cf_ray $curator_cf_ray {
    "~^[A-Za-z0-9-]{1,64}$"  $http_cf_ray;
    default                  "";
}

# The path the client asked for, without the query string (search terms).
# $uri would log the file a deep link was answered with (/index.html).
map $request_uri $curator_request_path {
    "~^(?<curator_path>[^?]*)" $curator_path;
}

# One JSON object per request. The query string is left out (search terms);
# the client address is the one the API's rate limits use.
log_format curator escape=json
    '{"time":"$time_iso8601","client":"$curator_client_ip",'
    '"request_id":"$request_id",'
    '"api_request_id":"$upstream_http_x_request_id",'
    '"fly_request_id":"$curator_fly_request_id","cf_ray":"$curator_cf_ray",'
    '"method":"$request_method","path":"$curator_request_path",'
    '"status":$status,"bytes":$body_bytes_sent,"ms":$request_time,'
    '"upstream_ms":"$upstream_response_time"}';
