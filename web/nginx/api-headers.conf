# Headers for answers from (or for) the API, included in each proxying
# location of site.conf. An add_header in a location replaces the server's,
# so this repeats what every answer needs; the API's own copies are hidden
# so each header appears once. The API sends the same values, so its
# answers do not change; nginx's own 413, 502 and 504 now carry them as
# well. The request id is the API's when it answered (http.conf).
proxy_hide_header X-Content-Type-Options;
proxy_hide_header X-Frame-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Cache-Control;
proxy_hide_header X-Request-ID;
proxy_hide_header Strict-Transport-Security;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Cache-Control "no-store" always;
add_header X-Request-ID $curator_api_request_id always;
add_header Strict-Transport-Security $curator_hsts always;
