# hotel-curator web: static SPA + /api reverse proxy.
# Installed as /etc/nginx/conf.d/default.conf in nginxinc/nginx-unprivileged
# (runs as a non-root user, listens on 8080). This file is included in the
# http context, so `map` is allowed here.

# Hashed build assets never change; everything else is revalidated.
map $uri $curator_cache_control {
    ~^/assets/  "public, max-age=31536000, immutable";
    default     "no-cache";
}

server {
    # IPv4 only: Docker disables IPv6 inside containers by default.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 64k;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Security headers for the app. Keep in sync with security-headers.ts
    # (test/nginx-headers.test.ts checks this). No inline scripts or styles.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cache-Control $curator_cache_control always;

    # The API, one origin for the browser: /api/v1/hotels -> http://api:8000/v1/hotels.
    # The trailing slash on proxy_pass strips the /api prefix. An add_header in
    # a location replaces the server-level ones, so each API location sets its
    # own: JSON answers get a CSP that allows nothing at all.
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /api;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_hide_header X-Content-Type-Options;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /api {
        return 301 /api/;
    }

    # The API's docs page. The API serves Swagger UI from its own pinned copy
    # (no CDN) with an external init script, and sends this same policy; it
    # is set here too because a location's add_header replaces the server's.
    # Styles need 'unsafe-inline' (Swagger UI sets style attributes). The page
    # fetches api/openapi.json and its assets relative to /api/docs, so they
    # go through the /api/ location above.
    location = /api/docs {
        proxy_pass http://api:8000/docs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Content-Type-Options;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    location /assets/ {
        try_files $uri =404;
    }

    # Single-page app: unknown paths get index.html and the router decides.
    location / {
        try_files $uri /index.html;
    }
}
