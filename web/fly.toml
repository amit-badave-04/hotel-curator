# Fly.io config: hotel-curator web (nginx serving the React app and proxying
# /api/ to the private API). The only public app (ADR 011).
# This file is "Fly mode": Fly terminates TLS for hotel-curator.fly.dev and
# nginx listens in plain HTTP. At the Cloudflare cutover, deploy with
# fly.cloudflare.toml instead (TLS passed through to nginx, Authenticated
# Origin Pulls). Deploy from this folder with scripts/deploy.py.
app = "hotel-curator"
primary_region = "lhr"
# SIGQUIT is nginx's graceful stop: it finishes in-flight requests.
kill_signal = "SIGQUIT"
kill_timeout = 30

[build]
  dockerfile = "Dockerfile"

[env]
  # Read by nginx/15-curator-site.sh, which renders the site at start.
  # fly: the client address is Fly-Client-IP, set by Fly's edge.
  CURATOR_EDGE = "fly"
  CURATOR_API_UPSTREAM = "hotel-curator-api.flycast:8000"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "get"
    path = "/"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
