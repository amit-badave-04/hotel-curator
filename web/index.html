<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>hotel-curator: hotel quality tiers from guest reviews</title>
    <meta
      name="description"
      content="Hotel quality tiers from guest reviews of European hotels, with how sure each grade is and quotes from the reviews where they are clear."
    />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1d1d1c" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!--
      Link previews. %PUBLIC_ORIGIN% is filled in at build time (seo.ts). No
      og:url: this file is served for every page, and a fixed og:url would
      make a shared hotel page link to the home page.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="hotel-curator" />
    <meta property="og:title" content="hotel-curator: hotel quality tiers from guest reviews" />
    <meta
      property="og:description"
      content="Hotel tiers you can check against what guests wrote: eight attributes, how sure each grade is, and quotes from the reviews where they are clear."
    />
    <meta property="og:image" content="%PUBLIC_ORIGIN%/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="hotel-curator: hotel tiers you can check against what guests wrote, with example tier badges."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="hotel-curator: hotel quality tiers from guest reviews" />
    <meta
      name="twitter:description"
      content="Hotel tiers you can check against what guests wrote: eight attributes, how sure each grade is, and quotes from the reviews where they are clear."
    />
    <meta name="twitter:image" content="%PUBLIC_ORIGIN%/og-image.png" />
    <meta
      name="twitter:image:alt"
      content="hotel-curator: hotel tiers you can check against what guests wrote, with example tier badges."
    />
  </head>
  <body>
    <noscript>hotel-curator needs JavaScript to show hotels.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
