<!doctype html>
<!--
  Source of public/og-image.png (1200 x 630), the link-preview image.
  Rendered by scripts/render-images.ts; colours are the light theme's
  tokens from src/index.css. No numbers here: the image is not rebuilt when
  the data changes, so it shows only what does not.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
      }
      body {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 64px 80px;
        color: #1a1a19;
        font-family: Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        background:
          radial-gradient(circle at 1px 1px, rgb(26 26 25 / 9%) 1px, transparent 0) 0 0 / 24px 24px,
          radial-gradient(900px 520px at 0% 0%, rgb(31 95 175 / 18%), transparent 70%),
          radial-gradient(700px 420px at 100% 100%, rgb(235 104 52 / 14%), transparent 70%),
          #f7f7f5;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 20px;
        font-size: 36px;
        font-weight: 700;
      }
      .brand svg {
        width: 64px;
        height: 64px;
      }
      .kicker {
        margin-bottom: 20px;
        color: #1f5faf;
        font-size: 22px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      h1 {
        max-width: 1000px;
        font-size: 70px;
        font-weight: 800;
        line-height: 1.05;
        letter-spacing: -0.02em;
      }
      .badges {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
      }
      .badge {
        padding: 10px 22px;
        border: 2px solid;
        border-radius: 12px;
        font-size: 26px;
        font-weight: 600;
      }
      .good {
        border-color: #a9c4ea;
        background: #e8f0fb;
        color: #1d4f8c;
      }
      .fair {
        border-color: #cfcdc5;
        background: #efeeea;
        color: #3f3f3a;
      }
      .caution {
        border-color: #eeac9c;
        background: #fbe8e3;
        color: #a3301c;
      }
      .unknown {
        border-style: dashed;
        border-color: #a19f96;
        color: #55554e;
      }
    </style>
  </head>
  <body>
    <div class="brand">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="7" fill="#1f5faf" />
        <path d="M9 23V9h3v5.5h8V9h3v14h-3v-5.5h-8V23z" fill="#fff" />
      </svg>
      hotel-curator
    </div>
    <div>
      <p class="kicker">Guest reviews, graded with evidence</p>
      <h1>Hotel tiers you can check against what guests wrote</h1>
    </div>
    <div class="badges">
      <span class="badge good">Good, but noisy</span>
      <span class="badge fair">Fair</span>
      <span class="badge caution">Caution</span>
      <span class="badge unknown">Not enough evidence to judge</span>
    </div>
  </body>
</html>
