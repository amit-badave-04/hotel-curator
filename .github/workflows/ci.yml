# Continuous integration: Python (lint, types, tests, coverage), web (lint,
# types, unit tests, build, API-client drift, npm audit), security (gitleaks,
# pip-audit, bandit), the Fly database image over TLS, nginx in each edge
# mode, end-to-end browser tests, and container builds. Actions are pinned
# to commit SHAs.
name: ci

on:
  push:
    branches: [main, v2]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"
  CURATOR_LOG_FORMAT: console

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Only the served model from Git LFS, cached by object id; once it is
      # tracked, the eval gates run on it and fail on an unpulled pointer.
      - uses: ./.github/actions/served-model
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.32"
          enable-cache: true
      - name: Install (all extras; torch comes from PyPI)
        run: uv sync --all-extras
      - name: Lint and format
        run: |
          uv run ruff check src tests scripts notebooks
          uv run ruff format --check src tests scripts notebooks
      - name: Types
        run: uv run mypy
      - name: Tests with coverage (fails under 80%)
        run: uv run pytest --cov --cov-report=term-missing --cov-fail-under=80
      - name: Generated OpenAPI schema is up to date
        run: |
          uv run python scripts/export_openapi.py
          git diff --exit-code web/openapi.json

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Dependency audit (fails on high or critical)
        run: npm audit --audit-level=high
      - name: Generated API client is up to date
        run: |
          npm run generate:api
          git diff --exit-code src/api/generated
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # the full history of the commit under test
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.32"
          enable-cache: true
      - name: Secrets in git history (gitleaks 8.30.1, checksum verified)
        run: |
          curl -sSLo gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum --check
          tar -xzf gitleaks.tgz gitleaks
          # HEAD's history only: other branches (such as a session backup
          # branch) are not part of what this commit ships.
          ./gitleaks git --config .gitleaks.toml --redact --exit-code 1 \
            --log-opts="--full-history HEAD" .
      - name: Known vulnerabilities in Python dependencies (pip-audit)
        # The export pins every package. The spaCy model wheel comes from a
        # GitHub release URL (SHA-256 pinned in uv.lock) and has no PyPI
        # advisory data, so it is the one line left out.
        run: |
          uv export --all-extras --no-hashes --no-emit-project \
            | grep -v '^en-core-web-sm @ ' > requirements-audit.txt
          uvx pip-audit==2.10.1 --strict --no-deps -r requirements-audit.txt
      - name: Python SAST (bandit)
        run: uvx bandit==1.9.4 -r src -q

  # The Fly database image (deploy/postgres) started the way Fly starts it:
  # TLS on, two non-superuser roles, pg_hba refusing plain connections and
  # the superuser over TCP. Two release commands then race against it.
  postgres-tls:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.32"
          enable-cache: true
      - name: Install (API, Postgres driver, test tools)
        run: uv sync --extra dev --extra postgres
      - name: Start the database image with throwaway passwords
        # Passwords reach docker by name (-e NAME), never on a command line.
        run: |
          docker build -t hotel-curator-db:ci deploy/postgres
          gen() { python3 -c 'import secrets; print(secrets.token_urlsafe(32))'; }
          export POSTGRES_PASSWORD="$(gen)" CURATOR_OWNER_PASSWORD="$(gen)" \
            CURATOR_APP_PASSWORD="$(gen)"
          for pw in "$POSTGRES_PASSWORD" "$CURATOR_OWNER_PASSWORD" "$CURATOR_APP_PASSWORD"; do
            echo "::add-mask::$pw"
          done
          docker run -d --name db -p 127.0.0.1:5432:5432 -e POSTGRES_DB=curator \
            -e POSTGRES_PASSWORD -e CURATOR_OWNER_PASSWORD -e CURATOR_APP_PASSWORD \
            hotel-curator-db:ci
          # TCP answers only after initialisation, once the real server runs.
          timeout 60 sh -c 'until docker exec db pg_isready -q -h 127.0.0.1; do sleep 1; done'
          base="127.0.0.1:5432/curator?sslmode=require"
          {
            echo "CURATOR_TEST_POSTGRES_OWNER_URL=postgresql+psycopg://curator_owner:${CURATOR_OWNER_PASSWORD}@${base}"
            echo "CURATOR_TEST_POSTGRES_APP_URL=postgresql+psycopg://curator_app:${CURATOR_APP_PASSWORD}@${base}"
          } >> "$GITHUB_ENV"
      - name: Roles, TLS and concurrent releases
        env:
          # Missing URLs fail the job instead of skipping every test.
          CURATOR_TEST_POSTGRES_REQUIRED: "1"
        run: uv run pytest tests/postgres -v
      - name: Database log on failure
        if: failure()
        run: docker logs db
      - name: Stop
        if: always()
        run: docker rm -f db

  # nginx in each edge mode (web/nginx, ADR 011) in front of a stub API:
  # which client address reaches the API, which headers are dropped, one
  # HSTS value, and in Cloudflare mode origin pulls, the PROXY protocol
  # source check and refused names.
  edge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.32"
          enable-cache: true
      - name: Install nginx, envsubst and the test tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends nginx gettext-base
          uv sync --extra dev
      - name: Edge modes against real nginx
        env:
          CURATOR_TEST_EDGE_REQUIRED: "1"
        run: |
          nginx -v
          uv run pytest tests/edge -v

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [python, web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.32"
          enable-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install API (serving dependencies only)
        run: uv sync --extra postgres
      - name: Install web and browser
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: End-to-end and accessibility tests
        working-directory: web
        run: npm run test:e2e

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: model
        uses: ./.github/actions/served-model
      # Once the weights are tracked, the API image must contain exactly the
      # judged files (REQUIRE_MODEL=1) and analyze must answer; before that,
      # analyze must answer 503, not fail some other way.
      - name: Build images
        env:
          REQUIRE_MODEL: ${{ steps.model.outputs.tracked == 'true' && '1' || '0' }}
        run: docker compose build
      - name: Start the stack and check it answers
        env:
          REQUIRE_MODEL: ${{ steps.model.outputs.tracked == 'true' && '1' || '0' }}
        run: |
          docker compose up -d --wait
          curl --fail --silent http://127.0.0.1:8000/readyz
          curl --fail --silent http://127.0.0.1:8080/ > /dev/null
          curl --fail --silent "http://127.0.0.1:8080/api/v1/hotels?page_size=1"
          code=$(curl --silent --output analyze.json --write-out '%{http_code}' \
            -X POST -H 'content-type: application/json' \
            --data '{"liked": "Spotless room and very friendly staff."}' \
            http://127.0.0.1:8080/api/v1/analyze)
          cat analyze.json; echo
          if [ "$REQUIRE_MODEL" = "1" ]; then
            test "$code" = 200
            curl --fail --silent http://127.0.0.1:8000/readyz | grep -q '"model"'
          else
            test "$code" = 503
          fi
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop
        if: always()
        run: docker compose down -v
