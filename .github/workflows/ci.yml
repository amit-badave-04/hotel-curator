# Continuous integration: Python (lint, types, tests, coverage), web (lint,
# types, unit tests, build, API-client drift, npm audit), security (gitleaks,
# pip-audit, bandit, workflow lint), the Fly database image over TLS, nginx
# in each edge mode, end-to-end browser tests, container builds with an
# image scan, and on main the deploy. Actions are pinned to commit SHAs.
name: ci

on:
  push:
    branches: [main, v2]
  pull_request:

permissions:
  contents: read

# Elsewhere a newer push cancels the run in progress. On main every commit
# gets its own run, never cancelled: the run ends with a deploy, which
# waits for approval and must not stop half way (deploy.yml then deploys
# only main's newest commit, one at a time).
concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  UV_FROZEN: "1"
  CURATOR_LOG_FORMAT: console

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # Credentials stay: the served-model step pulls from Git LFS.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 # zizmor: ignore[artipacked]
      # Only the served model from Git LFS, cached by object id; the eval
      # gates run on it and fail on an unpulled pointer.
      - uses: ./.github/actions/served-model
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.32"
          enable-cache: true
      - name: Install (all extras; torch comes from PyPI)
        run: uv sync --all-extras
      - name: Lint and format
        run: |
          uv run ruff check src tests scripts notebooks
          uv run ruff format --check src tests scripts notebooks
      - name: Types
        run: uv run mypy
      - name: Tests with coverage (fails under 80%)
        run: uv run pytest --cov --cov-report=term-missing --cov-fail-under=80
      - name: Generated OpenAPI schema and default policy are up to date
        run: |
          uv run python scripts/export_openapi.py
          git diff --exit-code web/openapi.json web/src/lib/tier-policy.json

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Dependency audit (fails on high or critical)
        run: npm audit --audit-level=high
      - name: Generated API client is up to date
        run: |
          npm run generate:api
          git diff --exit-code src/api/generated
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0 # the full history of the commit under test
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.32"
          enable-cache: true
      - name: Secrets in git history (gitleaks 8.30.1, checksum verified)
        run: |
          curl -sSLo gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum --check
          tar -xzf gitleaks.tgz gitleaks
          # HEAD's history only: other branches (such as a session backup
          # branch) are not part of what this commit ships.
          ./gitleaks git --config .gitleaks.toml --redact --exit-code 1 \
            --log-opts="--full-history HEAD" .
      - name: Known vulnerabilities in Python dependencies (pip-audit)
        # The export pins every package. The spaCy model wheel comes from a
        # GitHub release URL (SHA-256 pinned in uv.lock) and has no PyPI
        # advisory data, so it is the one line left out.
        run: |
          uv export --all-extras --no-hashes --no-emit-project \
            | grep -v '^en-core-web-sm @ ' > requirements-audit.txt
          uvx pip-audit==2.10.1 --strict --no-deps -r requirements-audit.txt
      - name: Python SAST (bandit)
        run: uvx bandit==1.9.4 -r src -q
      # Syntax and expressions (actionlint), and security mistakes such as
      # template injection, unpinned actions or excessive permissions
      # (zizmor, offline). zizmor fails on medium or high findings.
      - name: Workflow lint (actionlint, zizmor)
        run: |
          # GitHub's runners have shellcheck; actionlint runs it on every
          # script and fails on any finding.
          uvx --from actionlint-py==1.7.12.25 actionlint -shellcheck="$(command -v shellcheck)"
          uvx zizmor==1.31.1 --offline --min-severity medium .github/workflows

  # The Fly database image (deploy/postgres) started the way Fly starts it:
  # TLS on, two non-superuser roles, pg_hba refusing plain connections and
  # the superuser over TCP. Two release commands then race against it.
  postgres-tls:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.32"
          enable-cache: true
      - name: Install (API, Postgres driver, test tools)
        run: uv sync --extra dev --extra postgres
      - name: Start the database image with throwaway passwords
        # Passwords reach docker by name (-e NAME), never on a command line.
        run: |
          docker build -t hotel-curator-db:ci deploy/postgres
          gen() { python3 -c 'import secrets; print(secrets.token_urlsafe(32))'; }
          POSTGRES_PASSWORD=$(gen)
          CURATOR_OWNER_PASSWORD=$(gen)
          CURATOR_APP_PASSWORD=$(gen)
          export POSTGRES_PASSWORD CURATOR_OWNER_PASSWORD CURATOR_APP_PASSWORD
          for pw in "$POSTGRES_PASSWORD" "$CURATOR_OWNER_PASSWORD" "$CURATOR_APP_PASSWORD"; do
            echo "::add-mask::$pw"
          done
          docker run -d --name db -p 127.0.0.1:5432:5432 -e POSTGRES_DB=curator \
            -e POSTGRES_PASSWORD -e CURATOR_OWNER_PASSWORD -e CURATOR_APP_PASSWORD \
            hotel-curator-db:ci
          # TCP answers only after initialisation, once the real server runs.
          timeout 60 sh -c 'until docker exec db pg_isready -q -h 127.0.0.1; do sleep 1; done'
          base="127.0.0.1:5432/curator?sslmode=require"
          {
            echo "CURATOR_TEST_POSTGRES_OWNER_URL=postgresql+psycopg://curator_owner:${CURATOR_OWNER_PASSWORD}@${base}"
            echo "CURATOR_TEST_POSTGRES_APP_URL=postgresql+psycopg://curator_app:${CURATOR_APP_PASSWORD}@${base}"
          } >> "$GITHUB_ENV"
      - name: Roles, TLS and concurrent releases
        env:
          # Missing URLs fail the job instead of skipping every test.
          CURATOR_TEST_POSTGRES_REQUIRED: "1"
        run: uv run pytest tests/postgres -v
      - name: Database log on failure
        if: failure()
        run: docker logs db
      - name: Stop
        if: always()
        run: docker rm -f db

  # nginx in each edge mode (web/nginx, ADR 011) in front of a stub API:
  # which client address reaches the API, which headers are dropped, one
  # HSTS value, and in Cloudflare mode origin pulls, the PROXY protocol
  # source check and refused names.
  edge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.32"
          enable-cache: true
      - name: Install nginx, envsubst and the test tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends nginx gettext-base
          uv sync --extra dev
      - name: Edge modes against real nginx
        env:
          CURATOR_TEST_EDGE_REQUIRED: "1"
        run: |
          nginx -v
          uv run pytest tests/edge -v

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [python, web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.32"
          enable-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install API (serving dependencies only)
        run: uv sync --extra postgres
      - name: Install web and browser
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: End-to-end and accessibility tests
        working-directory: web
        run: npm run test:e2e

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Credentials stay: the served-model step pulls from Git LFS.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 # zizmor: ignore[artipacked]
      - id: model
        uses: ./.github/actions/served-model
      # With the weights tracked, the API image must contain exactly the
      # judged files (REQUIRE_MODEL=1) and analyze must answer 200; a commit
      # without them must get 503 from analyze, not fail some other way.
      - name: Build images
        env:
          REQUIRE_MODEL: ${{ steps.model.outputs.tracked == 'true' && '1' || '0' }}
        run: docker compose build
      # Known vulnerabilities in both images: a CRITICAL one with a fix
      # available fails the job; HIGH ones with a fix are listed for review.
      # Trivy's image is pinned by digest in deploy/tools/trivy/Dockerfile.
      - name: Scan the images (Trivy)
        run: |
          scanner=$(sed -n 's/^FROM //p' deploy/tools/trivy/Dockerfile)
          trivy() {
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              -v trivy-cache:/root/.cache/ "$scanner" "$@"
          }
          for target in hotel-curator-api:local hotel-curator-web:local; do
            trivy image --no-progress --ignore-unfixed --severity HIGH,CRITICAL "$target"
            trivy image --no-progress --ignore-unfixed --severity CRITICAL \
              --skip-db-update --exit-code 1 "$target"
          done
      - name: Start the stack and check it answers
        env:
          REQUIRE_MODEL: ${{ steps.model.outputs.tracked == 'true' && '1' || '0' }}
        run: |
          docker compose up -d --wait
          curl --fail --silent http://127.0.0.1:8000/readyz
          curl --fail --silent http://127.0.0.1:8080/ > /dev/null
          curl --fail --silent "http://127.0.0.1:8080/api/v1/hotels?page_size=1"
          code=$(curl --silent --output analyze.json --write-out '%{http_code}' \
            -X POST -H 'content-type: application/json' \
            --data '{"liked": "Spotless room and very friendly staff."}' \
            http://127.0.0.1:8080/api/v1/analyze)
          cat analyze.json; echo
          if [ "$REQUIRE_MODEL" = "1" ]; then
            test "$code" = 200
            curl --fail --silent http://127.0.0.1:8000/readyz | grep -q '"model"'
          else
            test "$code" = 503
          fi
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop
        if: always()
        run: docker compose down -v

  # A push to main that passed every job above deploys to Fly.io
  # (.github/workflows/deploy.yml: approval in the "production" environment,
  # then the API, the web app and a smoke test), once the owner has set up
  # the environment and turned deploys on (repository variable
  # CURATOR_DEPLOY = true; docs/deploy/fly.md). Until then it is skipped.
  deploy:
    needs: [python, web, security, postgres-tls, edge, e2e, containers]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main'
      && vars.CURATOR_DEPLOY == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/deploy.yml
