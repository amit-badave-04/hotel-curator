services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - CURATOR_MODEL_DIR=artifacts/hotel_curator_clf
      - CURATOR_THRESHOLD_SET=val
      - CURATOR_USE_BF16=false
    volumes:
      - ../data:/app/data:ro
      - ../artifacts:/app/artifacts:ro
